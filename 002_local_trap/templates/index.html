<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>AI 맞춤형 여행 가이드 플래너</title>
    <!-- 마크다운 렌더링을 위한 marked.js 및 디자인을 위한 Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 min-h-screen py-10 px-4">
    <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-2xl p-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-2 text-center">
        🌍 AI 맞춤형 여행 플래너
      </h1>
      <p class="text-gray-500 text-center mb-8">
        조건을 입력하시면 LLM이 취향을 분석해 최적의 일정을 실시간으로 작성해
        드립니다.
      </p>

      <!-- 입력 폼 -->
      <form id="travelForm" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2"
            >여행 목적</label
          >
          <input
            type="text"
            id="purpose"
            required
            placeholder="예: 힐링, 맛집 탐방, 액티비티, 문화 유적지 투어"
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2"
            >여행 기간</label
          >
          <input
            type="text"
            id="duration"
            required
            placeholder="예: 2박 3일, 4박 5일"
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2"
            >여행 국가 (구분)</label
          >
          <select
            id="destination_type"
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
          >
            <option value="국내">국내</option>
            <option value="국외">국외</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2"
              >동반자 유형</label
            >
            <select
              id="companion"
              class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
            >
              <option value="가족">가족</option>
              <option value="친구">친구</option>
              <option value="연인">연인</option>
              <option value="혼자">혼자</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2"
              >인원수 (명)</label
            >
            <input
              type="number"
              id="companion_count"
              min="1"
              value="2"
              class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
            />
          </div>
        </div>

        <div class="md:col-span-2">
          <button
            type="submit"
            id="submitBtn"
            class="w-full bg-blue-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-blue-700 transition duration-200 shadow-md"
          >
            ✨ AI 맞춤 여행 계획 생성하기
          </button>
        </div>
      </form>

      <!-- 진행 상황 및 출력 영역 -->
      <div id="outputContainer" class="hidden border-t pt-6">
        <!-- 실시간 상태 피드백 바 -->
        <div
          id="statusBox"
          class="mb-4 p-4 bg-blue-50 border border-blue-200 text-blue-700 rounded-lg text-sm font-medium flex items-center"
        >
          <svg
            class="animate-spin -ml-1 mr-3 h-5 w-5 text-blue-600"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          <span id="statusText">작업을 준비 중입니다...</span>
        </div>

        <!-- 결과물 렌더링 영역 -->
        <h2 class="text-xl font-bold text-gray-800 mb-4">📋 추천 여행 일정</h2>
        <div
          id="resultContent"
          class="prose max-w-none bg-gray-50 p-6 rounded-xl border min-h-[200px] text-gray-700"
        ></div>
      </div>
    </div>

    <!-- 스트리밍 수신 및 UI 업데이트 스크립트 -->
    <script>
      const form = document.getElementById("travelForm");
      const outputContainer = document.getElementById("outputContainer");
      const statusBox = document.getElementById("statusBox");
      const statusText = document.getElementById("statusText");
      const resultContent = document.getElementById("resultContent");
      const submitBtn = document.getElementById("submitBtn");

      let rawMarkdown = "";

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        // 입력값 수집
        const payload = {
          purpose: document.getElementById("purpose").value,
          duration: document.getElementById("duration").value,
          destination_type: document.getElementById("destination_type").value,
          companion: document.getElementById("companion").value,
          companion_count: document.getElementById("companion_count").value,
        };

        // UI 초기화
        outputContainer.classList.remove("hidden");
        statusBox.classList.remove("hidden");
        resultContent.innerHTML = "";
        rawMarkdown = "";
        submitBtn.disabled = true;
        submitBtn.classList.add("opacity-50", "cursor-not-allowed");

        try {
          const response = await fetch("/generate_plan", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const reader = response.body.getReader();
          const decoder = new TextDecoder();

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value, { stream: true });
            const lines = chunk.split("\n\n");

            for (const line of lines) {
              if (line.startsWith("data: ")) {
                const data = JSON.parse(line.substring(6));

                if (
                  data.status === "analyzing" ||
                  data.status === "generating"
                ) {
                  statusText.innerText = data.message;
                } else if (data.status === "chunk") {
                  rawMarkdown += data.content;
                  // 실시간으로 마크다운을 HTML로 변환하여 출력 (일부 내용이라도 먼저 보이도록 함)
                  resultContent.innerHTML = marked.parse(rawMarkdown);
                } else if (data.status === "done") {
                  statusBox.classList.add("hidden"); // 완료 시 상태창 숨김
                } else if (data.status === "error") {
                  statusText.innerText = data.message;
                  statusBox.className =
                    "mb-4 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm font-medium";
                }
              }
            }
          }
        } catch (error) {
          statusText.innerText =
            "❌ 통신 중 오류가 발생했습니다: " + error.message;
          statusBox.className =
            "mb-4 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm font-medium";
        } finally {
          submitBtn.disabled = false;
          submitBtn.classList.remove("opacity-50", "cursor-not-allowed");
        }
      });
    </script>
  </body>
</html>
